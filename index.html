<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>새로고침 재고관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --navy:#16233F;
  --navy-light:#233657;
  --blue:#3468E0;
  --blue-soft:#EAF0FE;
  --bg:#F3F5F8;
  --card:#FFFFFF;
  --border:#E3E7EE;
  --text:#151B2B;
  --muted:#7A8399;
  --danger:#E0483B;
  --green:#1FA37A;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
}
header{
  background:var(--navy);
  color:#fff;
  padding:22px 18px 26px;
  border-radius:0 0 22px 22px;
}
header .brand{
  font-size:13px;
  letter-spacing:.12em;
  color:#9FB4E8;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:#F5A623;
  transition:background .2s;
}
.status-dot.online{background:var(--green);}
.status-dot.offline{background:var(--danger);}
header h1{
  font-size:22px;
  margin-top:4px;
  font-weight:700;
}
.summary-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.summary-box{
  flex:1;
  background:var(--navy-light);
  border-radius:12px;
  padding:12px 14px;
}
.summary-box .label{font-size:12px;color:#A9B7D6;}
.summary-box .value{font-size:17px;font-weight:700;margin-top:4px;}

.search-wrap{
  padding:16px 16px 0;
}
.search-wrap input{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  font-size:15px;
  outline:none;
}
.search-wrap input:focus{border-color:var(--blue);}

.container{padding:16px;}

.cat-card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  margin-bottom:16px;
  overflow:hidden;
}
.cat-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-left:5px solid var(--blue);
  cursor:pointer;
}
.cat-head .cat-title{
  font-size:16px;
  font-weight:700;
}
.cat-head .cat-count{
  font-size:12px;
  color:var(--muted);
  font-weight:500;
  margin-top:2px;
}
.cat-head-right{
  display:flex;
  align-items:center;
  gap:6px;
}
.cat-move{
  display:flex;
  gap:4px;
  margin-right:4px;
}
.cat-move button{
  width:24px;
  height:24px;
  border:1px solid var(--border);
  background:#FBFCFE;
  color:var(--muted);
  border-radius:6px;
  font-size:11px;
  line-height:1;
  cursor:pointer;
}
.cat-move button:disabled{
  opacity:.35;
  cursor:default;
}
.chev{
  transition:transform .2s;
  color:var(--muted);
}
.chev.open{transform:rotate(180deg);}
.icon-btn{
  border:none;
  background:none;
  color:var(--muted);
  font-size:18px;
  padding:6px;
  line-height:1;
  cursor:pointer;
}
.cat-body{
  border-top:1px solid var(--border);
  display:none;
}
.cat-body.open{display:block;}

.item-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  gap:10px;
}
.item-row:last-child{border-bottom:none;}
.item-move{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.item-move button{
  width:26px;
  height:22px;
  border:1px solid var(--border);
  background:#FBFCFE;
  color:var(--muted);
  border-radius:6px;
  font-size:11px;
  line-height:1;
  cursor:pointer;
}
.item-move button:disabled{
  opacity:.35;
  cursor:default;
}
.item-location{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  color:var(--blue);
  background:var(--blue-soft);
  padding:2px 7px;
  border-radius:6px;
  margin-bottom:4px;
}
.item-name{
  font-size:15px;
  font-weight:600;
}
.item-meta{
  font-size:12.5px;
  color:var(--muted);
  margin-top:3px;
}
.item-price{
  font-size:15px;
  font-weight:700;
  color:var(--blue);
  text-align:right;
  white-space:nowrap;
}
.item-left{flex:1;min-width:0;}

.add-item-btn{
  width:100%;
  padding:13px;
  text-align:center;
  color:var(--blue);
  font-weight:600;
  font-size:14px;
  background:var(--blue-soft);
  border:none;
  cursor:pointer;
}

.empty-cat{
  padding:24px 16px;
  text-align:center;
  color:var(--muted);
  font-size:13.5px;
}

.fab-row{
  position:fixed;
  bottom:18px;
  left:16px;
  right:16px;
  display:flex;
  gap:10px;
  max-width:520px;
  margin:0 auto;
}
.fab{
  flex:1;
  padding:15px;
  border-radius:14px;
  border:none;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.fab.primary{
  background:var(--blue);
  color:#fff;
  box-shadow:0 6px 16px rgba(52,104,224,.35);
}
.fab.ghost{
  background:var(--card);
  color:var(--navy);
  border:1px solid var(--border);
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(15,20,35,.45);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}
.overlay.open{display:flex;}
.sheet{
  background:var(--card);
  width:100%;
  max-width:520px;
  border-radius:20px 20px 0 0;
  padding:20px 18px 26px;
  max-height:88vh;
  overflow-y:auto;
}
.sheet h2{
  font-size:17px;
  margin-bottom:16px;
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:600;
}
.field input, .field select{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:15px;
  background:#FBFCFE;
  outline:none;
}
.field input:focus, .field select:focus{border-color:var(--blue);}
.unit-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.unit-opt{
  padding:11px 0;
  text-align:center;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:14px;
  font-weight:600;
  color:var(--text);
  background:#FBFCFE;
  cursor:pointer;
}
.unit-opt.selected{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}
.sheet-btns{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.sheet-btns button{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.btn-save{background:var(--blue);color:#fff;}
.btn-save:disabled{background:#B9C6E6;}
.btn-delete{background:#FDEDEB;color:var(--danger);}
.btn-cancel{background:#F1F3F7;color:var(--muted);}
.hidden{display:none !important;}

.setup-screen{
  padding:40px 24px;
  text-align:center;
}
.setup-screen h2{font-size:18px;margin-bottom:10px;}
.setup-screen p{font-size:14px;color:var(--muted);line-height:1.6;}

.log-section{
  margin:0 16px 16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.log-header{
  padding:13px 16px;
  font-size:14px;
  font-weight:700;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.log-header .log-user-btn{
  font-size:12px;
  font-weight:600;
  color:var(--blue);
  background:var(--blue-soft);
  border:none;
  padding:5px 10px;
  border-radius:8px;
  cursor:pointer;
}
.log-list{
  max-height:260px;
  overflow-y:auto;
  padding:10px 14px;
  display:flex;
  flex-direction:column;
  gap:9px;
}
.log-empty{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:14px 0;
}
.log-item{
  font-size:13px;
  line-height:1.5;
  color:var(--text);
  background:var(--bg);
  border-radius:10px;
  padding:8px 10px;
}
.log-author{
  font-weight:700;
  color:var(--navy);
  margin-right:2px;
}
.log-time{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}
</style>
</head>
<body>

<div id="setupScreen" class="setup-screen hidden">
  <h2>파이어베이스 설정이 필요하다</h2>
  <p>이 파일 맨 아래 firebaseConfig 부분에 본인의 파이어베이스 프로젝트 키를 넣어야 여러 명이 데이터를 공유할 수 있다. 채팅에 안내된 방법대로 설정해라</p>
</div>

<div id="appRoot" class="hidden">

<header>
  <div class="brand"><span class="status-dot" id="statusDot"></span> SEROGOCHIM · 실시간 동기화</div>
  <h1>새로고침 재고관리</h1>
  <div class="summary-row">
    <div class="summary-box">
      <div class="label">전체 품목</div>
      <div class="value" id="sumItemCount">0개</div>
    </div>
    <div class="summary-box">
      <div class="label">재고 총액</div>
      <div class="value" id="sumTotalValue">0원</div>
    </div>
  </div>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="제품명으로 검색">
</div>

<div class="container" id="catList"></div>

<div class="log-section">
  <div class="log-header">
    <span>변경 기록</span>
  </div>
  <div class="log-list" id="logList"></div>
</div>

<div class="fab-row">
  <button class="fab ghost" id="btnAddCategory">+ 분류 추가</button>
  <button class="fab primary" id="btnAddItemGlobal">+ 상품 추가</button>
</div>

</div>

<!-- 분류 추가 시트 -->
<div class="overlay" id="catOverlay">
  <div class="sheet">
    <h2>새 분류 추가</h2>
    <div class="field">
      <label>분류명</label>
      <input type="text" id="catNameInput" placeholder="예) 데코타일제품군">
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel" id="catCancelBtn">취소</button>
      <button class="btn-save" id="catSaveBtn">추가</button>
    </div>
  </div>
</div>

<!-- 상품 추가/수정 시트 -->
<div class="overlay" id="itemOverlay">
  <div class="sheet">
    <h2 id="itemSheetTitle">상품 추가</h2>
    <div class="field">
      <label>위치</label>
      <input type="text" id="itemLocationInput" placeholder="예) 매장 A구역, 창고 2층">
    </div>
    <div class="field">
      <label>분류</label>
      <select id="itemCatSelect"></select>
    </div>
    <div class="field">
      <label>제품명</label>
      <input type="text" id="itemNameInput" placeholder="예) 데코타일1500">
    </div>
    <div class="field">
      <label>수량단위</label>
      <div class="unit-grid" id="unitGrid">
        <div class="unit-opt" data-unit="개">개</div>
        <div class="unit-opt" data-unit="롤">롤</div>
        <div class="unit-opt" data-unit="박스">박스</div>
        <div class="unit-opt" data-unit="묶음">묶음</div>
      </div>
    </div>
    <div class="field">
      <label>수량</label>
      <input type="number" id="itemQtyInput" placeholder="예) 350" inputmode="numeric">
    </div>
    <div class="field">
      <label>가격 (원)</label>
      <input type="number" id="itemPriceInput" placeholder="예) 30000" inputmode="numeric">
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel" id="itemCancelBtn">취소</button>
      <button class="btn-save" id="itemSaveBtn">저장</button>
    </div>
    <div class="sheet-btns hidden" id="itemDeleteRow">
      <button class="btn-delete" id="itemDeleteBtn" style="width:100%">이 상품 삭제</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, limitToLast, writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ====================================================================
   여기에 본인의 파이어베이스 프로젝트 설정값을 채워넣어라.
   채팅에 안내된 순서대로 파이어베이스 콘솔에서 프로젝트를 만들고
   웹앱을 등록하면 아래와 똑같이 생긴 값을 받는다.
==================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCNpACKBrRc4e0aZcy4yindQPIHSMcOp50",
  authDomain: "serogochim-inventory.firebaseapp.com",
  projectId: "serogochim-inventory",
  storageBucket: "serogochim-inventory.firebasestorage.app",
  messagingSenderId: "881089077673",
  appId: "1:881089077673:web:9981db337464535f1ee4b8"
};
/* ==================================================================== */

const isConfigured = !firebaseConfig.apiKey.includes("여기에");

if(!isConfigured){
  document.getElementById('setupScreen').classList.remove('hidden');
} else {
  document.getElementById('appRoot').classList.remove('hidden');
  runApp();
}

function runApp(){

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const categoriesCol = collection(db, 'categories');
const itemsCol = collection(db, 'items');
const logsCol = collection(db, 'logs');

let categories = [];
let items = [];
let logs = [];
let openState = {};
let editingItemId = null;
let editingItemCatId = null;
let selectedUnit = '개';

async function addLog(message){
  try{
    await addDoc(logsCol, { message, createdAt: serverTimestamp() });
  }catch(e){ console.error(e); }
}

function setStatus(online){
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + (online ? 'online' : 'offline');
}
window.addEventListener('online', ()=>setStatus(true));
window.addEventListener('offline', ()=>setStatus(false));
setStatus(navigator.onLine);

onSnapshot(categoriesCol, (snap)=>{
  categories = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  render();
}, (err)=>{ console.error(err); });

onSnapshot(query(itemsCol, orderBy('createdAt','asc')), (snap)=>{
  items = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  render();
}, (err)=>{ console.error(err); });

onSnapshot(query(logsCol, orderBy('createdAt','asc'), limitToLast(60)), (snap)=>{
  logs = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  renderLogs();
}, (err)=>{ console.error(err); });

function renderLogs(){
  const listEl = document.getElementById('logList');
  if(logs.length === 0){
    listEl.innerHTML = '<div class="log-empty">아직 변경 기록이 없다</div>';
    return;
  }
  listEl.innerHTML = logs.map(l=>{
    const t = l.createdAt && l.createdAt.toDate ? l.createdAt.toDate() : null;
    const timeStr = t ? t.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '전송중';
    return `<div class="log-item">${escapeHtml(l.message||'')}<span class="log-time">${timeStr}</span></div>`;
  }).join('');
  listEl.scrollTop = listEl.scrollHeight;
}

function formatWon(n){
  return Number(n||0).toLocaleString('ko-KR') + '원';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function moveCategory(sortedList, catId, direction){
  const idx = sortedList.findIndex(c=>c.id === catId);
  const targetIdx = idx + direction;
  if(targetIdx < 0 || targetIdx >= sortedList.length) return;

  const current = sortedList[idx];
  const target = sortedList[targetIdx];
  const currentOrder = current.order !== undefined ? current.order : idx;
  const targetOrder = target.order !== undefined ? target.order : targetIdx;

  const batch = writeBatch(db);
  batch.update(doc(db,'categories', current.id), { order: targetOrder });
  batch.update(doc(db,'categories', target.id), { order: currentOrder });
  await batch.commit();
}

async function moveItem(sortedList, itemId, direction){
  const idx = sortedList.findIndex(i=>i.id === itemId);
  const targetIdx = idx + direction;
  if(targetIdx < 0 || targetIdx >= sortedList.length) return;

  const current = sortedList[idx];
  const target = sortedList[targetIdx];
  const currentOrder = current.order !== undefined ? current.order : idx;
  const targetOrder = target.order !== undefined ? target.order : targetIdx;

  const batch = writeBatch(db);
  batch.update(doc(db,'items', current.id), { order: targetOrder });
  batch.update(doc(db,'items', target.id), { order: currentOrder });
  await batch.commit();
}

function render(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const listEl = document.getElementById('catList');
  listEl.innerHTML = '';

  let totalItems = 0;
  let totalValue = 0;

  const sortedCategories = categories.slice().sort((a,b)=>{
    const oa = a.order !== undefined ? a.order : 0;
    const ob = b.order !== undefined ? b.order : 0;
    return oa - ob;
  });

  sortedCategories.forEach((cat, catIdx)=>{
    const catItems = items.filter(i=>i.categoryId === cat.id);
    catItems.forEach(it=>{
      totalItems += 1;
      totalValue += (Number(it.qty)||0) * (Number(it.price)||0);
    });

    const sortedCatItems = catItems.slice().sort((a,b)=>{
      const oa = a.order !== undefined ? a.order : 0;
      const ob = b.order !== undefined ? b.order : 0;
      return oa - ob;
    });
    const filteredItems = sortedCatItems.filter(it => !search || it.name.toLowerCase().includes(search));
    if(search && filteredItems.length === 0) return;

    const isOpen = openState[cat.id] !== undefined ? openState[cat.id] : true;

    const card = document.createElement('div');
    card.className = 'cat-card';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <div>
        <div class="cat-title">${escapeHtml(cat.name)}</div>
        <div class="cat-count">${catItems.length}개 품목</div>
      </div>
      <div class="cat-head-right">
        <div class="cat-move">
          <button type="button" data-action="catup" ${catIdx===0 || search ? 'disabled' : ''}>▲</button>
          <button type="button" data-action="catdown" ${catIdx===sortedCategories.length-1 || search ? 'disabled' : ''}>▼</button>
        </div>
        <button class="icon-btn" data-action="delcat" data-id="${cat.id}">삭제</button>
        <span class="chev ${isOpen?'open':''}">▾</span>
      </div>
    `;
    head.addEventListener('click', (e)=>{
      if(e.target.dataset.action === 'delcat' || e.target.dataset.action === 'catup' || e.target.dataset.action === 'catdown') return;
      openState[cat.id] = !isOpen;
      render();
    });

    head.querySelector('[data-action="catup"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      moveCategory(sortedCategories, cat.id, -1);
    });
    head.querySelector('[data-action="catdown"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      moveCategory(sortedCategories, cat.id, 1);
    });

    head.querySelector('[data-action="delcat"]').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm(cat.name + ' 분류를 삭제할까. 안의 상품도 함께 삭제된다')) return;
      const batch = writeBatch(db);
      items.filter(i=>i.categoryId === cat.id).forEach(i=>{
        batch.delete(doc(db,'items', i.id));
      });
      batch.delete(doc(db,'categories', cat.id));
      await batch.commit();
      addLog(`[분류 삭제] "${cat.name}" (포함된 품목 ${catItems.length}개도 함께 삭제됨)`);
    });

    const body = document.createElement('div');
    body.className = 'cat-body ' + (isOpen || search ? 'open' : '');

    if(filteredItems.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-cat';
      empty.textContent = '등록된 상품이 없다';
      body.appendChild(empty);
    } else {
      filteredItems.forEach((it, idx)=>{
        const row = document.createElement('div');
        row.className = 'item-row';
        const locationHtml = it.location ? `<div class="item-location">${escapeHtml(it.location)}</div>` : '';
        row.innerHTML = `
          <div class="item-move">
            <button type="button" data-action="up" ${idx===0 || search ? 'disabled' : ''}>▲</button>
            <button type="button" data-action="down" ${idx===filteredItems.length-1 || search ? 'disabled' : ''}>▼</button>
          </div>
          <div class="item-left">
            ${locationHtml}
            <div class="item-name">${escapeHtml(it.name)}</div>
            <div class="item-meta">${Number(it.qty).toLocaleString('ko-KR')} ${escapeHtml(it.unit)}</div>
          </div>
          <div class="item-price">${formatWon(it.price)}</div>
        `;
        row.querySelector('[data-action="up"]').addEventListener('click', (e)=>{
          e.stopPropagation();
          moveItem(sortedCatItems, it.id, -1);
        });
        row.querySelector('[data-action="down"]').addEventListener('click', (e)=>{
          e.stopPropagation();
          moveItem(sortedCatItems, it.id, 1);
        });
        row.addEventListener('click', ()=> openItemSheet(cat.id, it.id));
        body.appendChild(row);
      });
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-item-btn';
    addBtn.textContent = '+ ' + cat.name + '에 상품 추가';
    addBtn.addEventListener('click', ()=> openItemSheet(cat.id, null));
    body.appendChild(addBtn);

    card.appendChild(head);
    card.appendChild(body);
    listEl.appendChild(card);
  });

  document.getElementById('sumItemCount').textContent = totalItems.toLocaleString('ko-KR') + '개';
  document.getElementById('sumTotalValue').textContent = formatWon(totalValue);
}

// 분류 추가
const catOverlay = document.getElementById('catOverlay');
document.getElementById('btnAddCategory').addEventListener('click', ()=>{
  document.getElementById('catNameInput').value = '';
  catOverlay.classList.add('open');
});
document.getElementById('catCancelBtn').addEventListener('click', ()=> catOverlay.classList.remove('open'));
catOverlay.addEventListener('click', (e)=>{ if(e.target === catOverlay) catOverlay.classList.remove('open'); });
document.getElementById('catSaveBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('catNameInput').value.trim();
  if(!name){ alert('분류명을 입력해주세요'); return; }
  await addDoc(categoriesCol, { name, order: categories.length, createdAt: serverTimestamp() });
  addLog(`[분류 추가] "${name}"`);
  catOverlay.classList.remove('open');
});

// 상품 추가/수정
const itemOverlay = document.getElementById('itemOverlay');

function populateCatSelect(selectedId){
  const sel = document.getElementById('itemCatSelect');
  sel.innerHTML = '';
  categories.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    if(c.id === selectedId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function setUnitSelection(unit){
  selectedUnit = unit;
  document.querySelectorAll('.unit-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.unit === unit);
  });
}

document.querySelectorAll('.unit-opt').forEach(el=>{
  el.addEventListener('click', ()=> setUnitSelection(el.dataset.unit));
});

function openItemSheet(catId, itemId){
  if(categories.length === 0){
    alert('먼저 분류를 추가해라');
    return;
  }
  editingItemCatId = catId;
  editingItemId = itemId;

  populateCatSelect(catId);

  if(itemId){
    const item = items.find(i=>i.id === itemId);
    document.getElementById('itemSheetTitle').textContent = '상품 수정';
    document.getElementById('itemLocationInput').value = item.location || '';
    document.getElementById('itemNameInput').value = item.name;
    document.getElementById('itemQtyInput').value = item.qty;
    document.getElementById('itemPriceInput').value = item.price;
    setUnitSelection(item.unit);
    document.getElementById('itemDeleteRow').classList.remove('hidden');
  } else {
    document.getElementById('itemSheetTitle').textContent = '상품 추가';
    document.getElementById('itemLocationInput').value = '';
    document.getElementById('itemNameInput').value = '';
    document.getElementById('itemQtyInput').value = '';
    document.getElementById('itemPriceInput').value = '';
    setUnitSelection('개');
    document.getElementById('itemDeleteRow').classList.add('hidden');
  }

  itemOverlay.classList.add('open');
}

document.getElementById('btnAddItemGlobal').addEventListener('click', ()=>{
  const firstCat = categories[0];
  openItemSheet(firstCat ? firstCat.id : null, null);
});

document.getElementById('itemCancelBtn').addEventListener('click', ()=> itemOverlay.classList.remove('open'));
itemOverlay.addEventListener('click', (e)=>{ if(e.target === itemOverlay) itemOverlay.classList.remove('open'); });

document.getElementById('itemSaveBtn').addEventListener('click', async ()=>{
  const location = document.getElementById('itemLocationInput').value.trim();
  const name = document.getElementById('itemNameInput').value.trim();
  const qty = Number(document.getElementById('itemQtyInput').value);
  const price = Number(document.getElementById('itemPriceInput').value);
  const catId = document.getElementById('itemCatSelect').value;

  if(!name){ alert('제품명을 입력해라'); return; }
  if(!qty && qty !== 0){ alert('수량을 입력해라'); return; }
  if(!price && price !== 0){ alert('가격을 입력해라'); return; }

  const saveBtn = document.getElementById('itemSaveBtn');
  saveBtn.disabled = true;

  try{
    const catName = (categories.find(c=>c.id===catId) || {}).name || '';
    if(editingItemId){
      const oldItem = items.find(i=>i.id === editingItemId) || {};
      await updateDoc(doc(db,'items', editingItemId), {
        location, name, unit:selectedUnit, qty, price, categoryId:catId
      });

      const diffParts = [];
      if(oldItem.name !== name){
        diffParts.push(`제품명 "${oldItem.name}" → "${name}"`);
      }
      if(Number(oldItem.qty) !== qty || oldItem.unit !== selectedUnit){
        diffParts.push(`수량 ${Number(oldItem.qty||0).toLocaleString('ko-KR')}${oldItem.unit||''} → ${qty.toLocaleString('ko-KR')}${selectedUnit}`);
      }
      if(Number(oldItem.price) !== price){
        diffParts.push(`가격 ${formatWon(oldItem.price)} → ${formatWon(price)}`);
      }
      if((oldItem.location||'') !== location){
        diffParts.push(`위치 "${oldItem.location||'없음'}" → "${location||'없음'}"`);
      }
      if(oldItem.categoryId !== catId){
        const oldCatName = (categories.find(c=>c.id===oldItem.categoryId) || {}).name || '알수없음';
        diffParts.push(`분류 "${oldCatName}" → "${catName}"`);
      }

      if(diffParts.length > 0){
        addLog(`[상품 수정] "${name}" : ${diffParts.join(' · ')}`);
      }
    } else {
      const catItemCount = items.filter(i=>i.categoryId === catId).length;
      await addDoc(itemsCol, {
        location, name, unit:selectedUnit, qty, price, categoryId:catId,
        order: catItemCount, createdAt: serverTimestamp()
      });
      const locPart = location ? ` · 위치 ${location}` : '';
      addLog(`[상품 추가] "${name}" (${catName} · ${qty.toLocaleString('ko-KR')}${selectedUnit} · ${formatWon(price)}${locPart})`);
    }
    itemOverlay.classList.remove('open');
  } finally {
    saveBtn.disabled = false;
  }
});

document.getElementById('itemDeleteBtn').addEventListener('click', async ()=>{
  if(!confirm('이 상품을 삭제할까')) return;
  const item = items.find(i=>i.id === editingItemId);
  await deleteDoc(doc(db,'items', editingItemId));
  if(item){
    const catName = (categories.find(c=>c.id===item.categoryId) || {}).name || '';
    addLog(`[상품 삭제] "${item.name}" (${catName} · ${Number(item.qty||0).toLocaleString('ko-KR')}${item.unit||''} · ${formatWon(item.price)})`);
  }
  itemOverlay.classList.remove('open');
});

document.getElementById('searchInput').addEventListener('input', render);

}
</script>
